<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Foxstone Builders | Nashville</title>
<meta name="description" content="Foxstone Builders, custom luxury homes in Nashville, Tennessee. New website coming soon.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Libre+Franklin:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3eee4;--ink:#2b2e26;--muted:#6c6a5d;--line:#e1d9ca;--accent:#3e4a33;--brass:#a8844f}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Libre Franklin",system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column;min-height:100vh}
main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:48px 24px}
.mark{width:56px;height:56px;border:1.5px solid var(--brass);transform:rotate(45deg);margin-bottom:40px;display:flex;align-items:center;justify-content:center}
.mark span{transform:rotate(-45deg);font-family:"Cormorant Garamond",Georgia,serif;font-size:24px;font-weight:600;color:var(--accent)}
h1{font-family:"Cormorant Garamond",Georgia,serif;font-weight:500;font-size:clamp(40px,7vw,72px);letter-spacing:.02em;line-height:1.05;color:var(--accent)}
.rule{width:64px;height:1px;background:var(--brass);margin:28px auto}
.tag{font-size:13px;letter-spacing:.28em;text-transform:uppercase;color:var(--muted)}
p.lede{margin-top:28px;max-width:30em;font-size:16px;line-height:1.7;color:var(--muted)}
a{color:var(--accent);text-decoration:none;border-bottom:1px solid var(--brass);padding-bottom:1px}
a:hover{color:var(--brass)}
footer{padding:24px;text-align:center;font-size:12px;letter-spacing:.06em;color:var(--muted);border-top:1px solid var(--line)}
</style>
</head>
<body>
<main>
  <div class="mark" aria-hidden="true"><span>F</span></div>
  <h1>Foxstone Builders</h1>
  <div class="rule"></div>
  <div class="tag">Custom Homes &middot; Nashville, Tennessee</div>
  <p class="lede">Our new website is on the way. In the meantime, reach us at <a href="mailto:info@buildfoxstone.com">info@buildfoxstone.com</a>.</p>
</main>
<footer>&copy; <span id="y">2026</span> Foxstone Builders LLC</footer>
<script>document.getElementById('y').textContent=new Date().getFullYear()</script>
</body>
</html>
