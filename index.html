<style>
@font-face{font-family:"Foxstone Display";src:url("assets/fonts/display-regular.woff2") format("woff2");font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:"Foxstone Display";src:url("assets/fonts/display-italic.woff2") format("woff2");font-weight:400;font-style:italic;font-display:swap}

:root{
  --cream:#F6F0E5;   /* logo background */
  --brown:#332819;   /* logo ink */
  --brown-soft:#4a3b28;
  --display:"Foxstone Display",Georgia,"Times New Roman",serif;
  --body:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--cream);-webkit-text-size-adjust:100%}
body{
  min-height:100vh;min-height:100svh;
  display:flex;flex-direction:column;
  background:var(--cream);color:var(--brown);
  font-family:var(--body);font-size:1rem;line-height:1.6;
  -webkit-font-smoothing:antialiased;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
main{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:clamp(40px,8vh,96px) 24px;
}
.logo{margin:0;line-height:0}
.logo img{display:block;width:clamp(260px,72vw,640px);height:auto}

.rule{width:48px;height:1px;background:var(--brown);opacity:.5;margin:clamp(28px,5vh,56px) auto}

.tagline{
  font-family:var(--display);font-weight:400;
  font-size:clamp(1.6rem,1.05rem + 2.6vw,3rem);line-height:1.2;letter-spacing:.005em;
}
.tagline span{display:block}
.tagline em{font-style:italic}

.location{
  margin-top:clamp(20px,3vh,32px);
  font-size:.8125rem;letter-spacing:.24em;text-transform:uppercase;color:var(--brown-soft);
  text-wrap:balance;
}

.contact{margin-top:clamp(28px,5vh,52px);font-size:1.0625rem}
.contact a{
  color:var(--brown);text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:.3em;
  padding:.6em .4em;border-radius:2px;transition:text-decoration-color .3s;
}
.contact a:hover{text-decoration-color:transparent}
.contact a:focus-visible{outline:2px solid var(--brown);outline-offset:3px}

.contact .sep{margin:0 .5em;color:var(--brown-soft)}
@media (max-width:480px){.contact a{display:inline-block}.contact .sep{display:none}.contact a+.sep+a{display:block;margin-top:.25em}}

footer{padding:24px 24px 32px;text-align:center;font-size:.8125rem;color:var(--brown-soft)}

/* one quiet fade-in on load, no looping */
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.logo,.rule,.tagline,.location,.contact{animation:rise 1.2s cubic-bezier(.22,.61,.36,1) both}
.rule{animation-delay:.35s}
.tagline{animation-delay:.55s}
.location{animation-delay:.75s}
.contact{animation-delay:.95s}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

@media (min-width:1600px){html{font-size:112.5%}}
</style>
</head>
<body>
<main>
  <h1 class="logo"><img src="assets/foxstone-logo.svg" width="1337" height="639" alt="Foxstone Builders"></h1>
  <div class="rule" role="presentation"></div>
  <p class="tagline"><span>Clever where it counts.</span><span><em>Solid where it matters.</em></span></p>
  <p class="location">Custom homes in Nashville, Tennessee.</p>
  <p class="contact"><a href="mailto:info@buildfoxstone.com">info@buildfoxstone.com</a><span class="sep" aria-hidden="true">&middot;</span><a href="tel:+16292603690">(629) 260-3690</a></p>
</main>
<footer>&copy; <span id="y">2026</span> Foxstone Builders LLC</footer>
<script>document.getElementById("y").textContent=new Date().getFullYear()</script>
</body>
</html>
